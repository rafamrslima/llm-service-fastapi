[project]
name = "llm-service-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafael De Moraes Lima", email = "rafaelmrslima@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "datetime>=6.0",
    "fastapi[standard]>=0.141.1",
    "fastmcp>=4.0.5",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "ollama>=0.6.2",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
llm-service-fastapi = "llm_service_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
